name: Build Android APK

on:
  push:
    branches: [claude/darlingg-run-setup-5r8sho, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses (the runner image already ships the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk darlingg-run.apk
      - uses: actions/upload-artifact@v4
        with:
          name: darlingg-run-apk
          path: darlingg-run.apk
      - name: Publish to the "apk-latest" release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Darlingg Run (latest Android build)
          body: Debug-signed APK of the latest build. On Android, allow installs from this source, then open darlingg-run.apk.
          files: darlingg-run.apk
          prerelease: true
